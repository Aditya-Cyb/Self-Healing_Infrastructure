
groups:
  - name: infrastructure-alerts
    rules:
      - alert: NginxTargetDown
        expr: nginx_up == 0 or absent(nginx_up)
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "NGINX service is down"
          description: "NGINX is unavailable or its availability metric is missing."

      - alert: NginxExporterDown
        expr: up{job="nginx"} == 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "NGINX exporter is down"
          description: "Prometheus cannot scrape the NGINX exporter."

      - alert: PrometheusTargetDown
        expr: up{job="prometheus"} == 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Prometheus scrape target is down"
          description: "Prometheus cannot scrape its own metrics endpoint."
